# Keycloak (Red Hat Build of Keycloak) instance for the demo realm.
#
# Single-replica, single-Postgres, demo-grade — optimized for "comes up clean
# every time, easy to reset" over production HA. Production would set
# instances: 3 + Postgres replication.
#
# Authored for the RHBK v26 operator (CRD k8s.keycloak.org/v2alpha1):
#   - spec.hostname.hostname is the FULL URL in v26 (v22 took a bare host).
#   - spec.hostname.strict: false keeps hostname handling lenient for the demo.
#   - proxy-headers is passed via spec.additionalOptions (works across v22..v26)
#     so Keycloak trusts the X-Forwarded-* headers from the edge-terminating
#     OpenShift Route and renders issuer URLs as https.
#   - ingress.enabled: false — we own the Route (route.yaml); otherwise the
#     operator spawns a duplicate Route stuck in HostAlreadyClaimed.
#   - http.httpEnabled: true — the Route terminates TLS; Keycloak serves plain
#     HTTP on 8080 behind it.
#
# Admin bootstrap: the operator creates an `admin` user with a random password
# in the `keycloak-initial-admin` Secret on first start. Read it with:
#   oc get secret keycloak-initial-admin -n keycloak \
#     -o jsonpath='{.data.password}' | base64 -d
# Demo personas (alice/bob/demoadm) come from the KeycloakRealmImport, NOT here.
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: pde-openshift-reference
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db-rw.keycloak.svc
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  hostname:
    hostname: https://keycloak.apps.cluster.rh-pde.coderdemo.io
    strict: false
  ingress:
    enabled: false
  http:
    httpEnabled: true
  # Only the OpenShift router may reach Keycloak's HTTP port. Every consumer
  # (browsers, Coder, Gitea, Argo CD, the OpenShift OAuth server) comes in
  # through the Route, so nothing else in the cluster needs a direct path.
  # Assumes router pods run in the openshift-ingress namespace on the pod
  # network (the default LoadBalancerService publishing strategy); with a
  # HostNetwork IngressController this selector will not match — adjust first.
  # The management port (probes) keeps the operator's default rule.
  networkPolicy:
    enabled: true
    http:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-ingress
  additionalOptions:
    - name: proxy-headers
      value: xforwarded
  # JVM hardening: run Base64 on the portable code path instead of the
  # hardware-accelerated intrinsic. Temporary; revisit when the operator's
  # default image is next updated. Changing this rolls the Keycloak pod.
  # Verify on the live JVM, not the env:
  #   oc exec -n keycloak keycloak-0 -c keycloak -- \
  #     jcmd io.quarkus.bootstrap.runner.QuarkusEntryPoint VM.flags -all \
  #     | grep UseBASE64Intrinsics        # expect: UseBASE64Intrinsics = false
  # If this operator version rejects spec.env, set the same variable under
  # spec.unsupported.podTemplate.spec.containers[name=keycloak].env instead.
  env:
    - name: JAVA_OPTS_APPEND
      value: "-XX:-UseBASE64Intrinsics"
